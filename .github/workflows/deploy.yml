name: Deploy to Cloudflare

# Deploys the Vite build to the legacy Cloudflare Pages project
# `transporter3` (https://transporter3.pages.dev) on every push to main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      # The @cloudflare/vite-plugin emits a wrangler.json + .assetsignore into
      # dist/ for Worker uploads; strip them for the legacy Pages upload.
      - name: Clean dist for Pages
        run: node scripts/clean-pages.mjs

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name transporter3 --branch main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
